name: ThyoCloud Personal RDP (No Verification)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi Windows Server'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022
      customUsername:
        description: 'Username RDP'
        required: false
        default: 'thyouser'
      customPassword:
        description: 'Password RDP (min 12 characters)'
        required: true

jobs:
  build-rdp:
    runs-on: ${{ github.event.inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - name: ✅ Siap — Walang Verification
        env:
          USER: ${{ github.event.inputs.customUsername }}
          PASS: ${{ github.event.inputs.customPassword }}
          OS_TYPE: ${{ github.event.inputs.osChoice }}
          RUNNER_IP: ${{ runner.public-ip }}
        run: |
          Write-Host "=========================================="
          Write-Host "  🎉 RDP SIAP GUNAKAN!"
          Write-Host "=========================================="
          Write-Host "🖥️  OS         : $env:OS_TYPE"
          Write-Host  ""
          Write-Host "🔌 IP Address  : $env:RUNNER_IP"
          Write-Host "👤 Username    : $env:USER"
          Write-Host "🔑 Password    : $env:PASS"
          Write-Host "🔌 Port        : 3389"
          Write-Host ""
          Write-Host "⏱️  Sesi akan berjalan maksimal 6 jam"
          Write-Host "=========================================="
          Write-Host "💡 Catatan: GitHub-hosted runner tidak selalu mendukung RDP secara langsung."
          Write-Host "   Untuk akses penuh RDP, gunakan self-hosted runner atau layanan VPS terpisah."
          Write-Host "=========================================="
          
          # Opsional: Simpan credentials ke file log
          $credLog = "`nRDP CREDS`nIP: $env:RUNNER_IP`nUSER: $env:USER`nPASS: $env:PASS`nOS: $env:OS_TYPE`n"
          Add-Content -Path "rdp-creds.txt" -Value $credLog
          
        shell: powershell
        
